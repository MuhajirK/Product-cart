<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <title>Users data</title>
</head>
<body class="body-async">
  <div class="buttons">
    <button class="remove-all-cards" id="remove-all-cards">Удалить все карточки</button>
    <button class="remove-card" id="remove-card">Удалить карту</button>
    <button class="get-cards" id="get-cards">Получить карточки</button>
  </div>
  <div class="user-cards-wrapper"></div>
  <template id="user-cards-template">
    <div class="user-card">
      <p class="user-id"></p>
      <h2 class="user-name"></h2>
      <p class="user-surname"></p>
      <p class="user-age"></p>
      <p class="user-email"></p>
    </div>
  </template>
  <div class="data-loading" id="status-message">Данные загружаются</div>
  <script src="async.js"></script>
</body>
</html>
