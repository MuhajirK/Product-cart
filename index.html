<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <title>Product cart</title>
</head>
<body>
  <div class = "first-set">
    <div class="body_image">
      <div class = "buttons">
          <button id="recolor-first-cart-button">Перекрасить первую карточку</button>
          <button id="recolor-all-carts-button">Перекрасить все карточки</button>
          <button id="open-google-button">Перейти на Google</button>
          <button id="recolor-button">Перекрасить кнопку</button>
          <button id="registration-button">Регистрация</button>
      </div>
      <span class="choice-product"> Выбери свой продукт </span>
    </div>
  </div>
  <div class="product-cart-wrapper"></div>  
  <template id="product-card-template">
    <div class="product-cart">
      <img src="" alt="" class="product-cart__image">
      <p class="product-cart__normal-skin">для нормальной кожи</p>
      <h3 class="product-cart__title"></h3>
      <p class="product-cart__descr"></p>
      <span class="product-cart__text">Состав:</span>
      <ul class="product-cart__composition"></ul>
      <div class="product-cart__price-wrapper">
        <span class="product-cart__price">Цена</span>
        <span class="product-cart__price-value"></span>
      </div>
    </div>
  </template>
  <div class="modal">
    <div class="modal-form">
      <button class="close-button">x</button>
      <h4 class="registration">Регистрация</h4>
      <form class="registration-form">
        <label for="user-name">Имя:</label>
        <input type="text" id="user-name" name="user-name" placeholder="Введите имя" required>
        <label for="user-surname">Фамилия:</label>
        <input type="text" id="user-surname" name="user-surname" placeholder="Введите фамилию" required>
        <label for="birth-date">Дата рождения:</label>
        <input type="date" id="birth-date" name="birth-date" required>
        <label for="login">Логин:</label>
        <input type="email" id="login" name="login" placeholder="Введите логин" required>
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" placeholder="Введите пароль" minlength="8" required>
        <label for="confirm-password">Подтвердите пароль:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Подтвердите пароль"required>
        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>
  <footer>
    <div class="info-block">
      <h3 class="footer__label">Product Cards</h3>
      <p class="footer__description">У нас самые лучшие продукты для кожи!</p>
      <div class="social-links">
        <img src="/images/tg-icon.png" alt="tg-icon">
        <img src="/images/vk-icon.png" alt="vk-icon">
      </div>
    </div>
    <form class="subscribe-form">
      <label for="user-email" class="footer-subscribe-text">Подпишись на наши акции:</label>
      <div class="footer-subscribe">
        <input type="email" name="email" id="user-email" placeholder="Введи Email..." required>
        <img src="/images/vertical-line.png">
        <button class="subscribe">Подписаться</button>
      </div>
    </form>
    <div class="navigation-block">
      <p class="navigation-title">Быстрые ссылки</p>
      <nav class="footer-menu">
        <ul class="footer-menu-list">
          <li class="footer-menu-item"> 
            <a href="#" class="footer-menu-link">Главная</a>
          </li>
          <li class="footer-menu-item">
            <a href="#" class="footer-menu-link">Магазин</a>
          </li>
          <li class="footer-menu-item">
            <a href="#" class="footer-menu-link">Контакты</a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="copyright">
      <img src="/images/horizontal-line.png" class="line-image">
      <p class="copyright-text"> www.product-cards.com©all right reserve </p>
    </div>
  </footer>

  <script src = "homework-9.js"></script>
  <script src = "homework-5.js"></script>
  <script src = "homework-6.js"></script>
  <script src = "homework-7.js" type = module></script>
  <script src = "homework-8.js" type = module></script>
  <script src = "./script.js"></script>
</body>
</html>
